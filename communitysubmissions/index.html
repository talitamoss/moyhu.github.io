<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moyhu</title>
  <style>
    /* Body setup to ensure full height and content layout */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    /* Top banner section */
.top-banner {
  background-color: #2d6a4f; /* Green background */
  color: goldenrod;
  text-align: center;
  padding: 20px; /* Add padding for spacing */
  position: relative; /* Make the banner a positioning context */
  display: block; /* Ensure elements stack vertically */
}

/* Title styling (optional for spacing) */
.top-banner h1 {
  margin: 0; /* Remove default margin */
  font-size: 3em; /* Ensure the font size is prominent */
}

/* Slogan styling */
.top-banner .slogan {
  font-size: 1.3em;
  font-style: italic;
  color: #fff8dc; /* Light color for readability */
  margin-top: 10px; /* Add spacing below the title */
}


    /* Button section setup */
    .button-section {
      background-color: #ffd700;
      padding: 80px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 75px;
      flex-grow: 1;  /* Ensures it takes up remaining space */
    }

    .button-section a {
      text-decoration: none;
      padding: 20px 40px;
      background-color: #2d6a4f;
      color: white;
      border-radius: 10px;
      font-size: 1.4em;
      text-align: center;
      width: 260px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .button-section a:hover {
      background-color: #24553f;
      transform: translateY(-2px);
    }


/* Back button styling */
.back-button {
  position: absolute; /* Position relative to the banner */
  top: 50%; /* Adjust vertical positioning */
  left: 20px; /* Keep it 20px from the left */
  transform: translateY(-50%); /* Vertically center the button */
  text-decoration: none;
  font-size: 1.2em;
  font-weight: bold;
  color: #2d6a4f; /* Green text */
  background-color: #ffd700; /* Gold background */
  padding: 10px 20px; /* Padding for box effect */
  border-radius: 10px; /* Rounded corners */
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Subtle shadow */
  transition: background-color 0.3s ease, transform 0.2s ease; /* Transition effects */
}

.back-button:hover {
  background-color: #e6c200; /* Slightly darker gold on hover */
  transform: translateY(-50%) translateX(-2px); /* Slight lift on hover */
  text-decoration: none; /* Ensure no underline */
}

    /* Footer at the bottom */
    footer {
      background-color: #2d6a4f;
      color: white;
      text-align: center;
      padding: 15px 10px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="top-banner">
    <a href="javascript:history.back()" class="back-button">&larr; Back</a>
    <h1>Community</h1>
    <div class="slogan">Getting involved</div>
  </div>

  
  <div class="button-section">
    <a href="#">Suggest</a>
    <a href="#">Surveys</a>
    <a href="#">Contact</a>
  </div>

  <footer>
    &copy; 2025 Moyhu Community Action Group
  </footer>
</body>
</html>
