<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moyhu</title>
  <style>
    /* Body setup to ensure full height and content layout */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top banner section */
    .top-banner {
      background-color: #2d6a4f;
      color: goldenrod;
      text-align: center;
      padding: 40px 20px 20px;
    }

    .top-banner h1 {
      margin: 0;
      font-size: 3em;
    }

    .top-banner .slogan {
      font-size: 1.3em;
      font-style: italic;
      color: #fff8dc;
      margin-top: 10px;
    }

    /* Button section setup */
    .button-section {
      background-color: #ffd700;
      padding: 80px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 75px;
      flex-grow: 1;  /* Ensures it takes up remaining space */
    }

    .button-section a {
      text-decoration: none;
      padding: 20px 40px;
      background-color: #2d6a4f;
      color: white;
      border-radius: 10px;
      font-size: 1.4em;
      text-align: center;
      width: 260px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .button-section a:hover {
      background-color: #24553f;
      transform: translateY(-2px);
    }

    /* Footer at the bottom */
    footer {
      background-color: #2d6a4f;
      color: white;
      text-align: center;
      padding: 15px 10px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="top-banner">
    <h1>Moyhu</h1>
    <div class="slogan">Gateway to the King Valley</div>
  </div>

  <div class="button-section">
    <a href="#">What's on</a>
    <a href="#">Visit</a>
    <a href="#">Community Submissions</a>
  </div>

  <footer>
    &copy; 2025 Moyhu Community Action Group
  </footer>
</body>
</html>
